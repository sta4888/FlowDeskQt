# Для команд Alembic из консоли (alembic revision --autogenerate -m "..." и т.д.)
[alembic]
script_location = src/activity_tracker/infrastructure/db/migrations
prepend_sys_path = src
# Пусто = ACTIVITY_TRACKER_DB_URL или ~/.activity_tracker/tracker.db
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
