[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-tracker"
version = "0.1.0"
description = "Спрашивает, чем ты занимался, после 10 минут бездействия"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
activity-tracker = "activity_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
activity_tracker = [
    "infrastructure/db/migrations/script.py.mako",
    "infrastructure/db/migrations/versions/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
